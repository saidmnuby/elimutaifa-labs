name: Request hosting deployment

on:
  push:
    branches:
      - main

jobs:
  request-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger approved deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/saidmnuby/mitandao/actions/workflows/deploy.yml/dispatches \
          -d "{\"ref\":\"main\",\"inputs\":{\"deployment_id\":\"0\",\"repository\":\"saidmnuby/elimutaifa-labs\",\"branch\":\"main\",\"target\":\"/home/elimutai/db.elimutaifa.co.tz\",\"source_sha\":\"$GITHUB_SHA\"}}"
